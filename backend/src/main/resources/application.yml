spring:
  application:
    name: challengea-api
  datasource:
    # Local dev: Oracle 23ai Free from docker-compose.yml
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:challengea}
    password: ${DB_PASSWORD:challengea_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # tables come from Flyway migrations only
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Set JWT_SECRET (at least 32 characters) in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl: ${JWT_TTL:30d}
  cors:
    # Web app origins allowed to call the API (comma-separated). Lock this down in production.
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  livekit:
    # LiveKit media server (WebRTC). The URL is what phones connect to.
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:challengea-livekit-dev-secret-change-me}
  push:
    # Path to the Firebase service-account JSON. Empty = notifications are only logged.
    firebase-credentials: ${FIREBASE_CREDENTIALS:}
  otp:
    ttl: 5m
    # Dev only: return the SMS code in the API response (no SMS provider yet).
    dev-echo: ${OTP_DEV_ECHO:true}

# Seeds a Marcory cast (friends, chats, map pins) the first time the API starts.
# Sign in as moise@challengea.dev / challengea. Set MOCK_DATA=false to skip.
mock:
  enabled: ${MOCK_DATA:true}
