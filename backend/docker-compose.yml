# Local development: Oracle Database 23ai Free + LiveKit (calls) + the Challengea API.
#   docker compose up -d          (first start of Oracle takes ~30 s)
#   API:    http://localhost:8080   (health: /actuator/health)
#   Oracle: localhost:1521/FREEPDB1  user challengea / challengea_dev
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle_dev        # SYS/SYSTEM password (dev only)
      APP_USER: challengea
      APP_USER_PASSWORD: challengea_dev
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Media server for voice / video calls (WebRTC).
  # Phones connect to ws://<your computer>:7880; media uses UDP 7882 and TCP 7881.
  livekit:
    image: livekit/livekit-server:v1.9
    # Phones reach the call media at this address. In Docker the server can't
    # guess it: set LIVEKIT_NODE_IP to your computer's Wi-Fi address.
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: "devkey: challengea-livekit-dev-secret-change-me"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  api:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: challengea
      DB_PASSWORD: challengea_dev
      JWT_SECRET: change-me-in-production-at-least-32-characters
      OTP_DEV_ECHO: "true"   # returns the SMS code in the response until an SMS provider is plugged in
      LIVEKIT_URL: ws://localhost:7880   # use your computer's Wi-Fi address for real phones
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: challengea-livekit-dev-secret-change-me
      # Push notifications: put your Firebase key next to this file and uncomment.
      # FIREBASE_CREDENTIALS: /run/secrets/firebase.json
    # volumes:
    #   - ./firebase.json:/run/secrets/firebase.json:ro
    ports:
      - "8080:8080"

volumes:
  oracle-data:
