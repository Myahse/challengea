name: challengea
description: "Challengea - social app prototype (bubble chats, chat, games)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  cross_file: ^0.3.5+5
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  stomp_dart_client: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
